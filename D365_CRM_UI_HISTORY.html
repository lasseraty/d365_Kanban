<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bofor Oy – account form through the CRM versions</title>
<style>
:root{
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --strip-bg:#ffffff; --strip-text:#1b1f24; --strip-muted:#5f6b7a; --strip-line:#d9dee5; --strip-on-bg:#1b1f24; --strip-on-text:#ffffff;
  --w2k-desk:#3a6ea5;
  --xp-top:#3a7bd5; --xp-mid:#9cc4f0; --xp-hill:#5f9e35; --xp-low:#3f7a1f;
  --vista-a:#0b2f3a; --vista-b:#16676a; --vista-c:#3a9bd1;
  --w7-a:#0d4a8c; --w7-b:#3d9be0; --w7-c:#9fd2f5;
  --w11-a:#dfe7fb; --w11-b:#efe6f8; --w11-c:#d6ecf7; --w8-a:#0a4f8a; --w8-b:#1e88d0; --w8-c:#5cc0ee; --w10-a:#0b2350; --w10-b:#1565c0;
  --desk-text:#ffffff; --shade:rgba(0,0,0,.35); --veil:rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --strip-bg:#15181d; --strip-text:#e8ebef; --strip-muted:#9aa4b1; --strip-line:#2b313a; --strip-on-bg:#e8ebef; --strip-on-text:#15181d;
    --w2k-desk:#1f3d5e; --xp-top:#0b1c3d; --xp-mid:#1f3f73; --xp-hill:#1e3d16; --xp-low:#10240b;
    --vista-a:#03141a; --vista-b:#0b3a3c; --vista-c:#174f6e; --w7-a:#061e3a; --w7-b:#123f6b; --w7-c:#1f5a86;
    --w11-a:#1b2035; --w11-b:#2a2340; --w11-c:#14303d; --w8-a:#062a4a; --w8-b:#0d4a78; --w8-c:#1d6d96; --w10-a:#050f22; --w10-b:#0b3570; --shade:rgba(0,0,0,.6); --veil:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --strip-bg:#15181d; --strip-text:#e8ebef; --strip-muted:#9aa4b1; --strip-line:#2b313a; --strip-on-bg:#e8ebef; --strip-on-text:#15181d;
  --w2k-desk:#1f3d5e; --xp-top:#0b1c3d; --xp-mid:#1f3f73; --xp-hill:#1e3d16; --xp-low:#10240b;
  --vista-a:#03141a; --vista-b:#0b3a3c; --vista-c:#174f6e; --w7-a:#061e3a; --w7-b:#123f6b; --w7-c:#1f5a86;
  --w11-a:#1b2035; --w11-b:#2a2340; --w11-c:#14303d; --w8-a:#062a4a; --w8-b:#0d4a78; --w8-c:#1d6d96; --w10-a:#050f22; --w10-b:#0b3570; --shade:rgba(0,0,0,.6); --veil:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--strip-bg);font:11px/1.35 Tahoma,Verdana,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:1px dotted #000;outline-offset:-2px}

/* ---------- version strip ---------- */
.strip{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--strip-bg);color:var(--strip-text);border-bottom:1px solid var(--strip-line);font:13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.strip .who{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.strip .who small{display:block;font-weight:400;color:var(--strip-muted);font-size:11px}
.vers{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.vers::-webkit-scrollbar{display:none}
.vers button{flex:none;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:5px 12px;border:1px solid var(--strip-line);border-radius:8px;background:none;color:var(--strip-text);cursor:pointer;font:600 14px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif}
.vers button small{font-weight:400;font-size:11px;color:var(--strip-muted)}
.vers button:hover{border-color:var(--strip-muted)}
.vers button[aria-current="true"]{background:var(--strip-on-bg);border-color:var(--strip-on-bg);color:var(--strip-on-text)}
.vers button[aria-current="true"] small{color:inherit;opacity:.75}
.vers button:focus-visible{outline:2px solid var(--strip-text);outline-offset:2px}

/* ---------- stage + desktops ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scene{flex:1;min-height:0;display:flex;flex-direction:column}
.os-w2k{background:var(--w2k-desk)}
.os-xp{background:radial-gradient(120% 60% at 30% 100%,var(--xp-hill) 0 55%,transparent 56%),radial-gradient(110% 55% at 85% 105%,var(--xp-low) 0 50%,transparent 51%),linear-gradient(180deg,var(--xp-top),var(--xp-mid) 70%)}
.os-vista{background:radial-gradient(80% 40% at 70% 40%,var(--vista-c),transparent 70%),radial-gradient(70% 50% at 20% 70%,var(--vista-b),transparent 70%),var(--vista-a)}
.os-win7{background:radial-gradient(60% 50% at 60% 45%,var(--w7-c),transparent 70%),linear-gradient(160deg,var(--w7-a),var(--w7-b))}
.os-win11{background:radial-gradient(70% 60% at 25% 30%,var(--w11-c),transparent 70%),linear-gradient(135deg,var(--w11-a),var(--w11-b))}
.desktop{flex:1;min-height:0;position:relative;display:flex;padding:14px 18px}
.desk-icon{position:absolute;left:14px;top:14px;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:1px solid transparent;padding:4px;cursor:pointer;color:var(--desk-text);text-shadow:1px 1px 2px #000;text-align:center}
.os-win11 .desk-icon{font:12px "Segoe UI",system-ui,sans-serif;color:var(--strip-text);text-shadow:none}
.desk-icon:hover{border:1px dotted currentColor}

/* ---------- window frames ---------- */
.window{position:relative;z-index:1;color-scheme:light;color:#000;margin:auto;width:100%;max-width:1080px;height:100%;max-height:760px;display:flex;flex-direction:column;overflow:hidden}
.window.max{max-width:none;max-height:none;border-radius:0!important}
.titlebar{flex:none;display:flex;align-items:center;gap:6px;user-select:none}
.titlebar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .ticon{width:16px;height:16px;flex:none}
.wbtn{flex:none;display:grid;place-items:center;padding:0;cursor:pointer}
.wbtn svg{width:10px;height:10px}

.os-w2k .window{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000,4px 6px 16px var(--shade);padding:2px}
.os-w2k .titlebar{height:20px;padding:0 2px 0 4px;gap:4px;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font:bold 11px Tahoma,sans-serif}
.os-w2k .wbtn{width:16px;height:14px;background:#d4d0c8;border:1px solid;border-color:#fff #404040 #404040 #fff;color:#000}
.os-w2k .wbtn.x{margin-left:2px}

.os-xp .window{background:#ece9d8;border:1px solid #0831d9;border-radius:8px 8px 0 0;box-shadow:3px 5px 22px var(--shade)}
.os-xp .titlebar{height:28px;padding:0 4px 0 7px;background:linear-gradient(180deg,#3d95ff 0%,#0058ee 10%,#0058ee 50%,#0066ff 88%,#003dd7 100%);color:#fff;font:bold 13px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px #0a1883}
.os-xp .wbtn{width:21px;height:21px;border:1px solid #fff;border-radius:3px;background:linear-gradient(#6aa5ff,#2463e6);color:#fff}
.os-xp .wbtn.x{background:linear-gradient(#f0947c,#c4341b)}

.os-vista .window{background:#e9eef4;border:1px solid #1b2a3a;border-radius:8px 8px 0 0;box-shadow:0 6px 28px var(--shade)}
.os-vista .titlebar{height:30px;padding:0 6px 0 8px;background:linear-gradient(#71869c,#40556c 48%,#2b3c50 52%,#3a4f66);color:#fff;font:12px "Segoe UI",Tahoma,sans-serif;text-shadow:0 0 6px #000}
.os-vista .wbtn{width:26px;height:18px;border:1px solid #1e2b38;border-radius:3px;background:linear-gradient(#90a4ba,#4c6077 48%,#3a4d63 52%,#566b81);color:#fff}
.os-vista .wbtn.x{width:44px;background:linear-gradient(#eaa694,#c8432d 48%,#b62f19 52%,#d4624a)}

.os-win7 .window{background:#dfe9f5;border:1px solid #6d8db5;border-radius:7px 7px 0 0;box-shadow:0 6px 28px var(--shade)}
.os-win7 .titlebar{height:30px;padding:0 6px 0 8px;background:linear-gradient(#dbe8f6,#bdd4ee 48%,#aecbea 52%,#c6dbf1);color:#1e3550;font:12px "Segoe UI",Tahoma,sans-serif}
.os-win7 .wbtn{width:26px;height:18px;border:1px solid #6d8db5;border-radius:3px;background:linear-gradient(#f2f6fb,#d2e0f1 48%,#c2d5ec 52%,#dbe7f5);color:#2c4766}
.os-win7 .wbtn.x{width:44px;border-color:#8a2d1d;background:linear-gradient(#eaa694,#c8432d 48%,#b62f19 52%,#d4624a);color:#fff}

.os-win11 .window{background:#f3f3f3;border:1px solid #c9c9c9;border-radius:8px;box-shadow:0 8px 32px var(--shade)}
.os-win11 .titlebar{height:38px;padding:0 0 0 8px;background:#e6e9ee;color:#1b1b1b;font:12px "Segoe UI",system-ui,sans-serif;align-items:flex-end;gap:0}
.os-win11 .btab{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;max-width:280px;min-width:0;background:#f7f7f7;border-radius:8px 8px 0 0;white-space:nowrap}
.os-win11 .btab span{overflow:hidden;text-overflow:ellipsis}
.os-win11 .wbtn{width:44px;height:38px;border:none;background:none;color:#1b1b1b;align-self:stretch}
.os-win11 .wbtn:hover{background:#d6dbe2}
.os-win11 .wbtn.x:hover{background:#c42b1c;color:#fff}
.os-win11 .addr{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:#f7f7f7;border-bottom:1px solid #dcdcdc;font:12px "Segoe UI",system-ui,sans-serif;color:#444}
.os-win11 .addr svg{width:14px;height:14px;flex:none}
.os-win11 .addr div{flex:1;min-width:0;height:24px;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:#ececec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- taskbars ---------- */
.taskbar{flex:none;display:flex;align-items:center;gap:6px;user-select:none}
.task{min-width:0;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.task span{overflow:hidden;text-overflow:ellipsis}
.task svg{width:14px;height:14px;flex:none}
.tray{margin-left:auto;height:100%;display:flex;align-items:center;padding:0 12px}
.os-w2k .taskbar{height:30px;padding:2px;background:#d4d0c8;border-top:1px solid #fff}
.os-w2k .start,.os-w2k .task{height:24px;padding:0 8px;background:#d4d0c8;border:1px solid;border-color:#fff #404040 #404040 #fff;color:#000;font:bold 11px Tahoma,sans-serif}
.os-w2k .task{font-weight:normal;max-width:220px}
.os-w2k .task.on{border-color:#404040 #fff #fff #404040;background:#e8e6e1}
.os-w2k .tray{height:24px;border:1px solid;border-color:#808080 #fff #fff #808080;color:#000}
.os-xp .taskbar{height:30px;background:linear-gradient(#3c81f3,#245edb 12%,#245edb 85%,#1941a5);color:#fff}
.os-xp .start{height:100%;padding:0 18px 0 12px;border:none;border-radius:0 12px 12px 0;background:linear-gradient(#64c464,#4cb14c 20%,#2f8a2f);font:bold italic 15px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px 1px #1a4d1a;color:#fff;cursor:pointer}
.os-xp .task{max-width:240px;height:24px;padding:0 8px;border:1px solid #1941a5;border-radius:3px;background:#3c81f3;color:#fff}
.os-xp .task.on{background:#1e52b7;box-shadow:inset 1px 1px 2px rgba(0,0,0,.45)}
.os-xp .tray{background:#0f8de6;border-left:1px solid #0a5fb0;color:#fff}
.orb{width:32px;height:32px;margin:0 6px;border-radius:50%;border:1px solid #0b1a33;background:radial-gradient(circle at 50% 30%,#d6ecff,#4a90e2 45%,#123d82 80%);cursor:pointer;box-shadow:0 0 8px rgba(120,180,255,.6)}
.os-vista .taskbar{height:36px;background:linear-gradient(rgba(70,84,102,.95),rgba(12,16,22,.97));color:#fff;font:12px "Segoe UI",Tahoma,sans-serif}
.os-win7 .taskbar{height:38px;background:linear-gradient(rgba(60,100,150,.85),rgba(20,45,80,.92));color:#fff;font:12px "Segoe UI",Tahoma,sans-serif}
.os-vista .task,.os-win7 .task{max-width:240px;height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.25);border-radius:3px;background:rgba(255,255,255,.08);color:#fff}
.os-vista .task.on,.os-win7 .task.on{background:rgba(255,255,255,.22)}
.os-win11 .taskbar{height:46px;justify-content:center;position:relative;background:rgba(243,243,243,.88);border-top:1px solid #d0d0d0;color:#1b1b1b;font:12px "Segoe UI",system-ui,sans-serif}
.os-win11 .tbtile{width:40px;height:40px;border:none;border-radius:6px;background:none;display:grid;place-items:center;cursor:pointer}
.os-win11 .tbtile:hover,.os-win11 .task.on{background:rgba(0,0,0,.06)}
.os-win11 .tbtile svg{width:20px;height:20px}
.os-win11 .task{justify-content:center;position:relative}
.os-win11 .task span{display:none}
.os-win11 .task.on::after{content:"";position:absolute;bottom:2px;left:14px;right:14px;height:3px;border-radius:2px;background:#0f6cbd}
.os-win11 .tray{position:absolute;right:0;top:0}

/* ---------- dialogs ---------- */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--veil);padding:12px}
.veil[hidden]{display:none}
.dlg{color-scheme:light;color:#000;width:min(390px,100%);display:flex;flex-direction:column;max-height:100%;overflow:hidden;background:#ece9d8;box-shadow:3px 5px 22px var(--shade)}
.dlg.big{width:min(520px,100%)}
.dlg .db{padding:14px;display:flex;gap:12px;align-items:flex-start;overflow:auto}
.dlg .db svg.ic{width:32px;height:32px;flex:none}
#msgText{white-space:pre-line}
.dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 12px}
.btn{min-width:75px;padding:3px 10px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ece9d8);cursor:pointer;color:#000}
.btn:hover{box-shadow:inset 0 0 0 1px #f8b330}
.btn[hidden]{display:none}
.os-w2k .dlg{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff}
.os-w2k .dlg .btn{border-radius:0;background:#d4d0c8;border-color:#fff #404040 #404040 #fff}
.os-xp .dlg{border:1px solid #0831d9;border-radius:8px 8px 0 0}
.os-vista .dlg,.os-win7 .dlg{background:#f0f0f0;border-radius:8px 8px 0 0;border:1px solid #556}
.os-vista .dlg .btn,.os-win7 .dlg .btn{border-color:#707070;background:linear-gradient(#f2f2f2,#ebebeb 50%,#dddddd 51%,#cfcfcf)}
.os-win11 .dlg{background:#fff;border-radius:8px;border:1px solid #d1d1d1;font:13px "Segoe UI",system-ui,sans-serif}
.os-win11 .dlg .titlebar{height:auto;padding:18px 20px 0;background:none;color:#242424;font:600 18px "Segoe UI",system-ui,sans-serif;text-shadow:none}
.os-win11 .dlg .titlebar .ticon{display:none}
.os-win11 .dlg .db{padding:12px 20px 18px}
.os-win11 .dlg .df{padding:0 20px 18px}
.os-win11 .dlg .btn{border-radius:4px;border:1px solid #d1d1d1;background:#fff;padding:6px 14px;font:600 13px "Segoe UI",system-ui,sans-serif}
.os-win11 .dlg .btn:first-child{background:#0f6cbd;border-color:#0f6cbd;color:#fff}
.lkbody{flex-direction:column;align-items:stretch!important;gap:0!important}
.lkrow{display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.lkrow input{font:inherit;height:22px;border:1px solid #7f9db9;padding:2px 4px;width:100%}
.lklist{border:1px solid #7f9db9;background:#fff;height:170px;overflow:auto}
.lklist table{width:100%;border-collapse:collapse}
.lklist th{text-align:left;font-weight:normal;padding:3px 6px;background:linear-gradient(#fff,#e2e9f4);border-bottom:1px solid #a5bfe1;position:sticky;top:0}
.lklist td{padding:3px 6px;border-bottom:1px solid #eef2f8}
.lklist td:first-child,.lklist th:first-child{width:24px;text-align:center}
.lklist tr[data-lkrow]{cursor:default}
.lklist tr[data-lkrow]:hover{background:#e6f0ff}
.lklist input{width:auto;height:auto}

/* ================= CLASSIC FAMILY (1.0 / 1.2 / 3.0 / 4.0) ================= */
.v10{--head-a:#35568e;--head-b:#1d3866;--head-text:#ffffff;--head-sub:#c9d6ee;--bar-a:#f1efe6;--bar-b:#dcd8c8;--bar-line:#a8a596;--hot:#c7d6ef;--hot-line:#33548c;--nav-bg:#e4e7ee;--nav-group:#1d3866;--nav-sel:#ffffff;--form-bg:#eef0f4;--line:#a9b4c6;--tab-off:#dde2ea;--hdr:#1d3866;--sb:#d4d0c8}
.v12{--head-a:#e4edf9;--head-b:#c3d6f1;--head-text:#15428b;--head-sub:#555555;--bar-a:#fbfcfe;--bar-b:#d4e2f6;--bar-line:#99b4d9;--hot:#ffe9a8;--hot-line:#e8b54a;--nav-bg:#d7e4f7;--nav-group:#15428b;--nav-sel:#ffffff;--form-bg:#e9f0fb;--line:#a5bfe1;--tab-off:#d5e2f5;--hdr:#15428b;--sb:#ece9d8}
.v30{--head-a:#e3edfc;--head-b:#a8c4ee;--head-text:#0b3d91;--head-sub:#3a5a8c;--bar-a:#fafcff;--bar-b:#c4d9f7;--bar-line:#7d9fd3;--hot:#ffe49c;--hot-line:#e0a234;--nav-bg:#e3eefc;--nav-group:#0b3d91;--nav-sel:#ffd88c;--form-bg:#eaf2fd;--line:#90b0de;--tab-off:#d6e5fa;--hdr:#0b3d91;--sb:#ece9d8}
.v40{--head-a:#f6f9fc;--head-b:#dae4f0;--head-text:#1e395b;--head-sub:#5a6f88;--bar-a:#fbfcfe;--bar-b:#e1e9f3;--bar-line:#b7c7db;--hot:#fdeeb3;--hot-line:#e6c35c;--nav-bg:#eef3f9;--nav-group:#1e395b;--nav-sel:#ffffff;--form-bg:#f3f6fa;--line:#c3d1e2;--tab-off:#e4ebf3;--hdr:#1e395b;--sb:#e9eef4}
.classic{font:11px/1.35 Tahoma,Verdana,"Segoe UI",Geneva,sans-serif}
.classic .crmhead{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;background:linear-gradient(var(--head-a),var(--head-b));border-bottom:1px solid var(--bar-line)}
.classic .crmhead .ent{font-size:10px;color:var(--head-sub)}
.classic .crmhead .rec{font:bold 16px/1.2 Tahoma,Verdana,sans-serif;color:var(--head-text)}
.classic .crmhead .brand{margin-left:auto;text-align:right;color:var(--head-text);font-size:10px;line-height:1.1}
.classic .crmhead .brand b{display:block;font:bold italic 18px/1 "Trebuchet MS",Tahoma,sans-serif;letter-spacing:-.5px}
.v40 .crmhead .brand b{font-style:normal;font-family:"Segoe UI",Tahoma,sans-serif;font-weight:600}
.menubar{flex:none;display:flex;gap:1px;padding:2px 4px;background:linear-gradient(var(--bar-a),var(--bar-b));border-bottom:1px solid var(--bar-line);position:relative;z-index:5}
.menu{position:relative}
.menu>button{background:none;border:1px solid transparent;padding:2px 8px;cursor:pointer}
.menu>button:hover,.menu.open>button{background:var(--hot);border-color:var(--hot-line)}
.dropdown{position:absolute;left:0;top:100%;z-index:20;min-width:180px;background:#fff;border:1px solid #7a96c5;box-shadow:2px 2px 4px rgba(0,0,0,.3);padding:2px;display:none}
.menu.open .dropdown{display:block}
.dropdown button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;padding:3px 18px;cursor:pointer;white-space:nowrap}
.dropdown button:hover,.dropdown button:focus-visible{background:#c8daf6;border-color:#7a96c5;outline:none}
.dropdown hr{border:0;border-top:1px solid #c3d1e2;margin:2px 4px}
.toolbar{flex:none;display:flex;align-items:center;gap:2px;padding:3px 6px;background:linear-gradient(var(--bar-a),var(--bar-b));border-bottom:1px solid var(--bar-line);overflow-x:auto;white-space:nowrap}
.tb{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid transparent;padding:2px 6px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--hot);border-color:var(--hot-line)}
.tb svg{width:16px;height:16px;flex:none}
.sep{width:1px;align-self:stretch;margin:2px 4px;background:var(--bar-line);box-shadow:1px 0 #fff}
.classic .body{flex:1;min-height:0;display:flex}
.classic .leftnav{flex:none;width:172px;background:var(--nav-bg);border-right:1px solid var(--line);overflow:auto;padding:4px 0 10px}
.classic .leftnav h3{margin:9px 8px 3px;font:bold 11px Tahoma,Verdana,sans-serif;color:var(--nav-group);border-bottom:1px solid var(--line);padding-bottom:2px}
.v30 .leftnav h3{margin:8px 0 3px;padding:3px 8px;border:none;border-top:1px solid #fff;border-bottom:1px solid var(--line);background:linear-gradient(#fdfeff,#c6daf6)}
.classic .leftnav button{display:flex;align-items:center;gap:6px;width:calc(100% - 8px);margin:0 4px;padding:3px 6px;border:1px solid transparent;background:none;text-align:left;cursor:pointer}
.classic .leftnav button:hover{background:var(--hot);border-color:var(--hot-line)}
.classic .leftnav button[aria-current="page"]{background:var(--nav-sel);border-color:var(--line);font-weight:bold}
.v30 .leftnav button[aria-current="page"]{border-color:#c8891d}
.v40 .leftnav button{border-radius:3px}
.v10 .leftnav{padding-top:8px}
.leftnav svg{width:16px;height:16px;flex:none}
.classic .content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--form-bg)}
.classic .tabs{flex:none;display:flex;gap:2px;padding:8px 10px 0;overflow-x:auto}
.classic .tab{flex:none;padding:4px 14px;border:1px solid var(--line);border-bottom:none;background:var(--tab-off);cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px}
.classic .tab[aria-selected="true"]{background:#fff;font-weight:bold;z-index:1}
.v10 .tab{border-radius:0}
.classic .panel{flex:1;overflow:auto;background:#fff;margin:0 10px 10px;border:1px solid var(--line);padding:6px 14px 14px}
.classic .sec h4{margin:10px 0 6px;font:bold 11px Tahoma,Verdana,sans-serif;color:var(--hdr);border-bottom:1px solid var(--line);padding-bottom:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.fr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;min-width:0}
.fr.full{grid-column:1 / -1}
.fr>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr>label.r{color:#c00000}.fr>label.b{color:#0033cc}
.mk{margin-left:3px;font-weight:bold}.mk.r{color:#c00000}.mk.b{color:#0033cc}
.fc{min-width:0}
.classic input,.classic select,.classic textarea,.ribbon input,.ribbon select,.ribbon textarea{font:inherit;color:#000;background:#fff;border:1px solid #7f9db9;padding:2px 4px;width:100%;height:20px;border-radius:0}
.classic textarea,.ribbon textarea{height:auto;resize:vertical}
.v40 input,.v40 select,.v40 textarea{border-color:#a8b8cc}
.window :disabled{background:#f3f3f3;color:#666}
.radios{display:flex;gap:12px;flex-wrap:wrap}
.radios label{display:inline-flex;gap:3px;align-items:center}
.radios input{width:auto!important;height:auto!important}
.lookup{display:flex;min-width:0}
.lookup .lkval{flex:1;min-width:0;height:20px;border:1px solid #7f9db9;border-right:none;background:#f3f3f3;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.lookup .lkval a,.window a{color:#0033cc}
.lookup button{flex:none;width:22px;height:20px;border:1px solid #7f9db9;background:linear-gradient(#fff,#dde6f3);cursor:pointer;padding:0;display:grid;place-items:center}
.lookup button svg{width:13px;height:13px}
.ro{color:#555}
.note{border:1px solid var(--line,#c3d1e2);margin:8px 0;background:#fff}
.note .nh{background:linear-gradient(#fff,#e2e9f4);padding:3px 6px;color:#555;border-bottom:1px solid var(--line,#c3d1e2)}
.note .nb{padding:6px;white-space:pre-wrap}
.newnote{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.newnote .btn{align-self:flex-start}
.fa{flex:none;width:200px;display:flex;flex-direction:column;background:var(--nav-bg);border-left:1px solid var(--line)}
.fa.shut{width:26px}
.fa .fah{display:flex;align-items:center;gap:6px;padding:4px 6px;background:linear-gradient(var(--bar-a),var(--bar-b));border-bottom:1px solid var(--line);font-weight:bold;color:var(--hdr);white-space:nowrap;overflow:hidden}
.fa .fah button{border:1px solid var(--line);background:#fff;width:16px;height:16px;padding:0;line-height:12px;cursor:pointer;flex:none}
.fa.shut .fah span{display:none}
.fa .fab{padding:8px;overflow:auto}
.fa .fat{font-weight:bold;margin-bottom:6px}
.fa .fasub{color:#555;margin:6px 0 4px;border-bottom:1px solid var(--line)}
.fa .fab button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:2px 4px;color:#0033cc;cursor:pointer}
.fa .fab button:hover{background:var(--hot);border-color:var(--hot-line)}
.statusbar{flex:none;display:flex;gap:2px;padding:2px;background:var(--sb);border-top:1px solid #fff}
.statusbar>div{border:1px solid;border-color:#a6a49b #fff #fff #a6a49b;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar .msg{flex:1}
.statusbar .zone{display:flex;align-items:center;gap:4px}
.statusbar svg{width:14px;height:14px}

/* grids (classic + 2011) */
.gview{flex:1;min-height:0;display:flex;flex-direction:column}
.ghead{flex:none;padding:8px 12px 4px;font-weight:bold;font-size:14px;color:var(--hdr,#1e395b)}
.gtool{flex:none;display:flex;align-items:center;gap:2px;margin:0 10px;padding:3px 4px;background:linear-gradient(var(--bar-a,#fbfcfe),var(--bar-b,#e1e9f3));border:1px solid var(--line,#c3d1e2);border-bottom:none;overflow-x:auto;white-space:nowrap}
.gtool .spacer{flex:1}
.gtool select{width:auto;height:18px}
.gwrap{flex:1;min-height:0;overflow:auto;margin:0 10px;background:#fff;border:1px solid var(--line,#c3d1e2)}
table.grid{border-collapse:collapse;width:100%;min-width:520px}
.grid th{position:sticky;top:0;text-align:left;font-weight:normal;padding:3px 6px;background:linear-gradient(#fff,#e2e9f4);border-bottom:1px solid var(--line,#c3d1e2);border-right:1px solid #d3deee;white-space:nowrap}
.grid td{padding:3px 6px;border-bottom:1px solid #eef2f8;white-space:nowrap}
.grid td:first-child,.grid th:first-child{width:22px;text-align:center}
.grid input{width:auto!important;height:auto!important}
.grid tbody tr[data-row]:hover{background:#e6f0ff}
.grid tbody tr.sel{background:#c8daf6}
.grid .empty td{text-align:left;color:#555;padding:10px;white-space:normal}
.gfoot{flex:none;display:flex;align-items:center;gap:8px;margin:0 10px 10px;padding:3px 6px;background:linear-gradient(var(--bar-a,#fbfcfe),var(--bar-b,#e1e9f3));border:1px solid var(--line,#c3d1e2);border-top:none;overflow-x:auto;white-space:nowrap}
.az{display:flex;gap:1px}
.az button{background:none;border:1px solid transparent;padding:0 3px;color:#0033cc;cursor:pointer}
.az button[aria-pressed="true"]{font-weight:bold;color:#000;border-color:var(--line,#c3d1e2);background:#fff}
.gfoot .count{margin-left:auto;color:#555}

/* ================= CRM 2011 (ribbon) ================= */
.ribbon{font:11px/1.35 "Segoe UI",Tahoma,Verdana,sans-serif;--bar-a:#fbfcfe;--bar-b:#e3ebf5;--line:#c5d5ea;--hdr:#1f497d;--hot:#fde9a6;--hot-line:#e3c36a}
.ribbon .rb{flex:none;background:linear-gradient(#fefefe,#e8eef6);border-bottom:1px solid #b3c6df;position:relative;z-index:5}
.ribbon .rtabs{display:flex;align-items:flex-end;gap:2px;padding:4px 6px 0;background:linear-gradient(#dfe8f4,#cfdcee);border-bottom:1px solid #b3c6df}
.ribbon .rtabs>button,.ribbon .rtabs .menu>button{border:1px solid transparent;border-bottom:none;background:none;padding:3px 12px;cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1px}
.ribbon .rtabs>button[aria-selected="true"]{background:#fefefe;border-color:#b3c6df}
.ribbon .rtabs .menu>button.rfile{background:linear-gradient(#3f86d3,#1d5ea8);color:#fff;font-weight:600;border-color:#174f8d}
.ribbon .rtabs .menu.open>button.rfile{background:#174f8d}
.ribbon .rgroups{display:flex;gap:0;padding:3px 4px 0;overflow-x:auto;min-height:86px}
.rg{flex:none;display:flex;flex-direction:column;border-right:1px solid #d3deec;padding:0 6px}
.rgc{flex:1;display:flex;gap:2px;align-items:flex-start}
.rgcol{display:flex;flex-direction:column;gap:1px}
.rgl{text-align:center;color:#4d6182;padding:2px 0 3px}
.rbig{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:3px 2px;border:1px solid transparent;border-radius:2px;background:none;cursor:pointer;text-align:center;line-height:1.15}
.rbig svg{width:32px;height:32px}
.rsm{display:flex;align-items:center;gap:4px;padding:1px 6px 1px 3px;border:1px solid transparent;border-radius:2px;background:none;cursor:pointer;white-space:nowrap}
.rsm svg{width:16px;height:16px}
.rbig:hover,.rsm:hover{background:linear-gradient(#fff6d6,#fde59e);border-color:#e3c36a}
.ribbon .body{flex:1;min-height:0;display:flex}
.ribbon .leftnav{flex:none;width:182px;background:linear-gradient(90deg,#f4f8fc,#e9f0f8);border-right:1px solid #c5d5ea;overflow:auto;padding:6px 0 10px}
.ribbon .leftnav .fsel{margin:0 8px 6px;padding:3px 6px;border:1px solid #c5d5ea;background:#fff;font-weight:600;color:#1f497d}
.ribbon .leftnav h3{margin:10px 8px 2px;font:600 11px "Segoe UI",Tahoma,sans-serif;color:#1f497d}
.ribbon .leftnav h5{margin:6px 12px 1px;font:600 10px "Segoe UI",Tahoma,sans-serif;color:#6b7c93}
.ribbon .leftnav button{display:flex;align-items:center;gap:6px;width:calc(100% - 12px);margin:0 6px;padding:2px 8px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;color:#1e3a60;border-radius:2px}
.ribbon .leftnav button:hover{background:#dde9f7;border-color:#b3c6df}
.ribbon .leftnav button[aria-current="page"]{background:#fff;border-color:#9fb8d9;font-weight:600}
.ribbon .content{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.ribbon .fhead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #dde6f1;background:linear-gradient(#fff,#f2f6fb)}
.ribbon .fhead .ent{font-size:10px;color:#6b7c93}
.ribbon .fhead .rec{font:20px/1.15 "Segoe UI",Tahoma,sans-serif;color:#1f497d}
.ribbon .fscroll{flex:1;overflow:auto;padding:4px 16px 16px}
.tsec{margin-top:8px}
.tsec>h2{display:flex;align-items:center;gap:6px;margin:6px 0;font:600 13px "Segoe UI",Tahoma,sans-serif;color:#1f497d}
.tsec>h2 button{border:none;background:none;padding:0 2px;color:#1f497d;cursor:pointer;font-size:10px;transition:transform .15s}
.tsec.shut>h2 button{transform:rotate(-90deg)}
.tsec.shut>.tbody{display:none}
.ribbon .sec h4{margin:8px 0 4px;font:600 11px "Segoe UI",Tahoma,sans-serif;color:#4d6182;border-bottom:1px solid #dde6f1;padding-bottom:2px}
.ribbon .fr{grid-template-columns:128px minmax(0,1fr)}
.ribbon input,.ribbon select,.ribbon textarea{border-color:#c5d5ea}
.ribbon input:hover,.ribbon select:hover,.ribbon textarea:hover{border-color:#8fb0da}
.ribbon .lookup .lkval,.ribbon .lookup button{border-color:#c5d5ea}
.ribbon .lookup .lkval{background:#fff}
.ribbon .statusbar{background:#e9eef5;border-top:1px solid #c5d5ea}
.ribbon .statusbar>div{border:none}
.subgrid{border:1px solid #c5d5ea;margin:4px 0}
.subgrid table.grid{min-width:0}

/* ================= DYNAMICS 365 ONLINE (Unified Interface, new look) ================= */
.uci{font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:#242424;background:#f5f5f5}
.uci .appbar{flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#0b2447;color:#fff}
.uci .appbar button{border:none;background:none;color:#fff;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:4px}

.uci .appbar svg{width:18px;height:18px}

.uci .osaved{font-weight:400;font-size:14px;color:#616161}

.uci .ohf{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.uci .ohf div{min-width:0}
.uci .hv{font-weight:600;white-space:nowrap}

.uci .ocol{display:flex;flex-direction:column;gap:12px;min-width:0}

.uci .card h3 button:hover{background:#f0f0f0}
.uci .card h3 svg{width:16px;height:16px}
.uci .fr{grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:3px 0}
.uci .fr>label{color:#424242}
.uci .fr>label.r,.uci .fr>label.b{color:#424242}
.uci input,.uci select,.uci textarea{font:inherit;color:#242424;width:100%;min-height:32px;padding:4px 10px;border:1px solid transparent;border-bottom-color:#d1d1d1;border-radius:4px;background:#f5f5f5}

.uci textarea{resize:vertical}
.uci .lookup .lkval{height:32px;display:flex;align-items:center;border:1px solid transparent;border-bottom-color:#d1d1d1;border-radius:4px 0 0 4px;background:#f5f5f5;padding:0 10px}
.uci .lookup .lkval a{color:#0f6cbd;text-decoration:none;font-weight:600}
.uci .lookup button{height:32px;width:32px;border:1px solid transparent;border-bottom-color:#d1d1d1;border-radius:0 4px 4px 0;background:#f5f5f5}
.uci .radios label{gap:6px}
.uci .tlnew{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.obtn{align-self:flex-start;padding:5px 14px;border:1px solid #d1d1d1;border-radius:4px;background:#fff;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer;color:#242424}

.tli{display:flex;gap:10px;padding:10px 0;border-top:1px solid #f0f0f0}

.uci .pcard{display:flex;gap:10px;align-items:center;margin-top:8px}
.uci .pav{width:36px;height:36px;border-radius:50%;background:#e3c7f4;color:#3b1d5c;display:grid;place-items:center;font-weight:600;flex:none}

.uci .ogt th{text-align:left;font-weight:600;font-size:12px;color:#424242;padding:8px;border-bottom:1px solid #e0e0e0;white-space:nowrap}

.uci .ogt td:first-child,.uci .ogt th:first-child{width:28px}
.uci .ogt input{min-height:0;width:auto;padding:0}
.uci .ogt tr[data-row]:hover{background:#f5f5f5}
.uci .ogt tr.sel{background:#ebf3fc}
.uci .ogt a{color:#0f6cbd;text-decoration:none}
.uci .ogt .empty td{color:#616161;white-space:normal;padding:16px 8px}
.uci .gtools{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.uci .gcount{font-size:12px;color:#616161;padding-top:8px}
.uci .ofoot{flex:none;display:flex;gap:16px;align-items:center;padding:6px 16px;background:#fff;border-top:1px solid #e0e0e0;font-size:12px;color:#424242}
.uci .ofoot .msg{margin-left:auto}
.uci .copilot{flex:none;width:300px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #e0e0e0}

/* ---------------- render ---------------- */
const stage = $('#stage'), scene = $('#scene');
let ZOOM = null;
try{ const z = parseFloat(localStorage.getItem('crmZoom')); if(z >= 0.5 && z <= 1.3) ZOOM = z; }catch(e){}
const autoZoom = () => innerWidth < 1400 ? 0.8 : innerWidth < 1800 ? 0.9 : 1;
const zoomNow = () => ZOOM || autoZoom();
function renderZoom(){
  stage.style.setProperty('--z', zoomNow());
  $('#zoomc').innerHTML = '<button type="button" data-zoom="-1" aria-label="Zoom out">−</button><button type="button" data-zoom="0" title="'+(ZOOM ? 'Back to automatic zoom' : 'Automatic zoom for this screen')+'">'+Math.round(zoomNow()*100)+' %</button><button type="button" data-zoom="1" aria-label="Zoom in">+</button>';
}
addEventListener('resize', () => { if(!ZOOM) renderZoom(); });
function renderStrip(){
  $('#vers').innerHTML = VERS.map(v => '<button type="button" data-ver="'+v.tok+'" aria-current="'+(v===V)+'">'+v.k+'<small>'+v.yr+'</small></button>').join('');
  $('#seg').innerHTML = '<button type="button" data-mode="browser" aria-pressed="'+!isMobile()+'">Browser</button><button type="button" data-mode="mobile" aria-pressed="'+isMobile()+'"'+(V.mob ? '' : ' disabled title="CRM 1.0 had no mobile client"')+'>Mobile</button>';
  const cap = isMobile() ? V.mob : V.mob ? 'Web client' : 'Web client. Mobile access arrived with CRM 1.2.';
  $('#mcap').textContent = cap; $('#mcap').title = cap;
  renderZoom();
  const cur = $('#vers [aria-current="true"]'); if(cur) cur.scrollIntoView({inline:'nearest', block:'nearest'});
}
function render(){
  const keepScroll = {};
  ['.panel','.fscroll','.oscroll','.fscroll2','.mscroll'].forEach(s => { const el = scene.querySelector(s); if(el) keepScroll[s] = el.scrollTop; });
  stage.className = 'stage os-'+V.os+(ui.win!=='open' && !isMobile() ? ' closed' : '')+(isMobile() ? ' mobile' : '');
  scene.innerHTML = sceneHTML();
  Object.keys(keepScroll).forEach(s => { const el = scene.querySelector(s); if(el) el.scrollTop = keepScroll[s]; });
  $('#msgTitle').textContent = V.prod;
  $('#lkTitle').textContent = V.fam==='uci' ? 'Lookup records' : 'Look Up Records';
  tick(); refreshChrome();
}
function refreshChrome(){
  const n = nameNow();
  $$('[data-bind="title"]').forEach(e => e.textContent = winTitle());
  $$('[data-task]').forEach(e => e.setAttribute('aria-label', winTitle()));
  $$('[data-bind="name"]').forEach(e => e.textContent = n);
  $$('[data-bind="saved"]').forEach(e => e.textContent = '- '+(S.dirty ? 'Unsaved' : 'Saved'));
  $$('[data-bind="unsaved"]').forEach(e => e.textContent = S.dirty ? (V.fam==='flat' ? 'unsaved changes' : 'Unsaved changes') : '');
  $$('[data-bind="mod"]').forEach(e => e.textContent = S.mod);
  $$('[data-bind="rev"]').forEach(e => e.textContent = S.rev ? '€ '+S.rev : (V.ph || '---'));
  $$('[data-bind="emp"]').forEach(e => e.textContent = S.emp || (V.ph || '---'));
  const av = scene.querySelector('.oavatar, .mu-av'); if(av) av.textContent = initials(n);
  document.title = n + ' – ' + (V.fam==='uci' ? 'Dynamics 365'+(V.u19?' (Unified Interface)':'') : V.prod+' '+V.k);
}
function switchVersion(tok){
  const v = VERS.find(x => x.tok===tok); if(!v) return;
  V = v; resetUi(); renderStrip(); render();
  setHash();
}
function setHash(){ try{ history.replaceState(null,'','#'+V.tok+(isMobile() ? '-mobile' : '')); }catch(e){} }

/* ---------------- dialogs ---------------- */
let msgCb = null;
function msg(text, kind, onOk, withCancel){
  $('#msgText').textContent = text;
  $('#msgIcon').innerHTML = '<use href="#'+(kind==='warn'?'i-warn':'i-infobig')+'"/>';
  $('#msgIcon').style.display = V.fam==='uci' ? 'none' : '';
  $('#msgCancel').hidden = !withCancel;
  msgCb = onOk || null; $('#msgVeil').hidden = false; $('#msgOk').focus();
}
$('#msgOk').addEventListener('click', () => { $('#msgVeil').hidden = true; const cb = msgCb; msgCb = null; if(cb) cb(); });
$('#msgCancel').addEventListener('click', () => { $('#msgVeil').hidden = true; msgCb = null; });

let lkField = null;
function openLookup(id){
  if(!S.active){ msg('Activate the account before changing it.', 'warn'); return; }
  lkField = id; const spec = LK[F[id].lk];
  $('#lkEntity').textContent = spec.entity; $('#lkCol1').textContent = spec.c1; $('#lkCol2').textContent = spec.c2;
  $('#lkFind').value = ''; renderLk(''); $('#lkVeil').hidden = false; $('#lkFind').focus();
}
function renderLk(q){
  const spec = LK[F[lkField].lk];
  const items = spec.items.filter(i => i[0].toLowerCase().includes(q.toLowerCase()));
  $('#lkBody').innerHTML = items.length ? items.map(i => '<tr data-lkrow><td><input type="radio" name="lkpick" value="'+esc(i[0])+'"'+(i[0]===S[lkField]?' checked':'')+' aria-label="'+esc(i[0])+'"></td><td>'+esc(i[0])+'</td><td>'+esc(i[1])+'</td></tr>').join('')
    : '<tr><td colspan="3" style="padding:8px;color:#555">No records match “'+esc(q)+'”.</td></tr>';
}
$('#lkGo').addEventListener('click', () => renderLk($('#lkFind').value));
$('#lkFind').addEventListener('keydown', e => { if(e.key==='Enter') renderLk($('#lkFind').value); });
$('#lkBody').addEventListener('click', e => { const tr = e.target.closest('tr[data-lkrow]'); if(tr) tr.querySelector('input').checked = true; });
$('#lkBody').addEventListener('dblclick', e => { if(e.target.closest('tr[data-lkrow]')) $('#lkOk').click(); });
$('#lkOk').addEventListener('click', () => {
  const r = document.querySelector('input[name=lkpick]:checked');
  $('#lkVeil').hidden = true;
  if(r && r.value !== S[lkField]) setField(lkField, r.value, true);
});
$('#lkCancel').addEventListener('click', () => $('#lkVeil').hidden = true);
$('#lkRemove').addEventListener('click', () => {
  $('#lkVeil').hidden = true;
  if(F[lkField].req==='r'){ msg('You must provide a value for '+F[lkField].l+'.', 'warn'); return; }
  setField(lkField, '', true);
});
function setField(id, val, rerender){ S[id] = val; S.dirty = true; if(rerender) render(); else refreshChrome(); }

/* ---------------- status + commands ---------------- */
let stTimer;
function status(t){
  const el = $('#stMsg'); if(!el) return;
  clearTimeout(stTimer); el.textContent = t;
  stTimer = setTimeout(() => { const e = $('#stMsg'); if(e) e.textContent = (V.fam==='uci' || V.fam==='flat' || isMobile()) ? '' : 'Done'; }, 4000);
}
function save(then){
  if(!S.name.trim()){
    ui.view = 'info'; ui.tab = V.fam==='uci' ? 'summary' : 'general';
    if(isMobile()){ ui.mscreen = 'record'; ui.mview = null; ui.mmenu = false; if(V.mfam==='mex') ui.medit = true; else ui.mtab = V.mfam==='pda' ? 'gen' : 'summary'; }
    render();
    msg(V.fam==='uci' ? 'Account Name: Required fields must be filled in.' : 'You must provide a value for Account Name.', 'warn', () => { const f = $('#f-name'); if(f) f.focus(); });
    return;
  }
  status('Saving…');
  $$('[data-bind="saved"]').forEach(e => e.textContent = '- Saving…');
  setTimeout(() => {
    S.dirty = false; S.mod = fmt(new Date()); refreshChrome();
    status(V.fam==='uci' ? 'Your changes were saved.' : 'The record was saved.');
    if(then) then();
  }, 600);
}
function closeWin(force){
  if(S.dirty && !force){
    msg('Your changes have not been saved.\n\nClick OK to close the form without saving, or Cancel to stay on the form.', 'warn', () => closeWin(true), true);
    return;
  }
  S.dirty = false; ui.win = 'closed'; render();
}
function setActive(on){ S.active = on; render(); status(on ? 'The account was activated.' : 'The account was deactivated.'); }
const CMD = {
  save: () => save(),
  saveclose: () => save(() => closeWin(true)),
  savenew: () => save(() => msg('A new, empty account form would open now.')),
  print: () => { try { window.print(); } catch(e) { msg('Printing is not available here.'); } },
  close: () => closeWin(),
  assign: () => openLookup('owner'),
  share: () => msg('Share gives other users or teams Read, Write, Assign or Share rights on this account.'),
  note: () => {
    ui.view = 'info';
    if(V.fam==='classic') ui.tab = 'notes'; else if(V.fam==='uci') ui.tab = 'summary'; else if(V.fam==='flat') ui.social = 'notes';
    render();
    if(V.fam==='ribbon'){ const s = $('#s-notes'); if(s){ s.classList.remove('shut'); s.scrollIntoView({block:'start'}); } }
    const t = $('#noteText'); if(t) t.focus();
  },
  addnote: () => {
    const t = $('#noteText'); const v = t ? t.value.trim() : '';
    if(!v){ msg('Type the note text before adding it.', 'warn'); return; }
    S.notes.push({when:fmt(new Date()), who:'Lasse Räty', text:v}); render(); status('Note added.');
  },
  deactivate: () => S.active
    ? msg('Deactivate this account? An inactive account can be viewed but not edited until it is activated again.', 'warn', () => setActive(false), true)
    : setActive(true),
  delete: () => msg('You are about to delete this account. Related contacts, activities and notes would be deleted too. Continue?', 'warn', () => closeWin(true), true),
  help: () => msg(V.req==='color' ? 'Red labels are required fields, blue labels are recommended.\n\nUse the tabs to move between General, Details, Administration and Notes, and the list on the left to see related records.'
    : V.fam==='flat' ? 'A red asterisk marks a required field and a blue plus marks a recommended one.\n\nUse the nav bar at the top: Sales opens the area, Accounts shows recently viewed records, and the record name lists related records such as contacts and opportunities. Save with the disk icon in the bottom-right corner.'
    : V.u19 ? 'A red asterisk marks a required field and a blue plus marks a recommended one.\n\nUse Summary and Details for the account’s own fields, and Related for its contacts, activities, opportunities and cases.'
    : V.req==='star' ? 'A red asterisk marks a required field and a blue plus marks a recommended one.\n\nUse the navigation on the left to jump between sections and related records.'
    : 'A red asterisk marks a required field.\n\nUse Summary and Details for the account’s own fields, and Related for its contacts, activities, opportunities and cases.'),
  about: () => msg(V.prod+'\nVersion '+V.k+'\n\nA clickable recreation of the '+V.yr+' user interface, showing the '+nameNow()+' account.'),
  copilot: () => { ui.copilot = !ui.copilot; render(); },
  refresh: () => status('Refreshed.'),
  call: () => msg(S.phone ? 'Calling '+S.phone+'…\n\nThe call would be logged as a phone call activity on '+nameNow()+'.' : 'There is no phone number on this account yet. Add one in the phone field first.'),
  email: () => msg(S.mail ? 'A new email to '+S.mail+' would open.' : 'There is no email address on this account yet. Add one in the email field first.'),
  mexsave: () => save(() => { ui.medit = false; render(); }),
  mcopilot: () => msg(copilotText())
};

/* ---------------- menus ---------------- */
function closeMenus(except){ $$('.menu.open').forEach(m => { if(m!==except){ m.classList.remove('open'); m.firstElementChild.setAttribute('aria-expanded','false'); } }); }
function openMenu(m){ closeMenus(m); m.classList.add('open'); m.firstElementChild.setAttribute('aria-expanded','true'); }

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  const ver = t.closest('[data-ver]'); if(ver){ switchVersion(ver.dataset.ver); return; }
  const zb = t.closest('[data-zoom]'); if(zb){ const d = +zb.dataset.zoom; ZOOM = d===0 ? null : Math.min(1.3, Math.max(0.5, Math.round((zoomNow() + d*0.1)*10)/10)); try{ if(ZOOM) localStorage.setItem('crmZoom', ZOOM); else localStorage.removeItem('crmZoom'); }catch(e){} renderZoom(); return; }
  const md = t.closest('[data-mode]'); if(md){ if(md.disabled) return; MODE = md.dataset.mode; ui.mmenu = false; renderStrip(); render(); setHash(); return; }
  const mb = t.closest('[data-menu]');
  if(mb){ const m = mb.parentElement; if(m.classList.contains('open')) closeMenus(); else openMenu(m); return; }
  if(!t.closest('.dropdown')) closeMenus();
  if(t.closest('.veil')) return;
  if(t.closest('[data-mmenu]')){ ui.mmenu = !ui.mmenu; render(); return; }
  const msc = t.closest('[data-mscreen]'); if(msc){ e.preventDefault(); ui.mscreen = msc.dataset.mscreen; ui.mview = null; ui.medit = false; ui.mmenu = false; render(); return; }
  const mo = t.closest('[data-mopen]'); if(mo){ e.preventDefault(); if(mo.dataset.mopen==='1'){ ui.mscreen = 'record'; ui.mview = null; ui.mmenu = false; render(); const sc = scene.querySelector('.mscroll'); if(sc) sc.scrollTop = 0; } else msg('“'+mo.dataset.mopen+'” would open here. Only the '+nameNow()+' account is part of this recreation.'); return; }
  const mt = t.closest('[data-mtab]'); if(mt){ ui.mtab = mt.dataset.mtab; ui.mview = null; ui.mmenu = false; render(); const sc = scene.querySelector('.mscroll'); if(sc) sc.scrollTop = 0; return; }
  const mr = t.closest('[data-mrel]'); if(mr){ e.preventDefault(); ui.mview = mr.dataset.mrel; ui.mmenu = false; render(); const sc = scene.querySelector('.mscroll'); if(sc) sc.scrollTop = 0; return; }
  if(t.closest('[data-mback]')){ e.preventDefault(); ui.mmenu = false; if(ui.mview) ui.mview = null; else if(ui.medit) ui.medit = false; else ui.mscreen = 'list'; render(); return; }
  if(t.closest('[data-medit]')){ e.preventDefault(); ui.medit = !ui.medit; render(); return; }

  const w = t.closest('[data-win]');
  if(w){
    const a = w.dataset.win;
    if(a==='min'){ ui.win = 'min'; render(); }
    else if(a==='max'){ ui.max = !ui.max; const win = scene.querySelector('.window'); if(win) win.classList.toggle('max', ui.max); }
    else closeWin();
    return;
  }
  if(t.closest('[data-task]')){ ui.win = ui.win==='open' ? 'min' : 'open'; render(); return; }
  if(t.closest('[data-desk]')){ ui.win = 'open'; render(); return; }

  const c = t.closest('[data-cmd]'); if(c){ const k = c.dataset.cmd; closeMenus(); if(ui.mmenu){ ui.mmenu = false; render(); } CMD[k](); return; }
  const m = t.closest('[data-msg]'); if(m){ e.preventDefault(); closeMenus(); msg(m.dataset.msg); return; }
  const fn = t.closest('[data-flatnav]'); if(fn){ ui.fnav = ui.fnav===fn.dataset.flatnav ? null : fn.dataset.flatnav; render(); return; }
  if(t.closest('[data-flatclose]')){ ui.fnav = null; render(); return; }
  const so = t.closest('[data-soc]'); if(so){ ui.social = so.dataset.soc; render(); return; }
  const n = t.closest('[data-nav]'); if(n){ closeMenus(); ui.view = n.dataset.nav; ui.az = 'All'; ui.fnav = null; render(); const sc = scene.querySelector('.oscroll, .fscroll2'); if(sc) sc.scrollTop = 0; return; }
  const tb = t.closest('[data-tab]'); if(tb){ ui.tab = tb.dataset.tab; render(); const p = scene.querySelector('.panel'); if(p) p.scrollTop = 0; return; }
  const ot = t.closest('[data-otab]'); if(ot){ ui.view = 'info'; ui.tab = ot.dataset.otab; render(); return; }
  const rt = t.closest('[data-rtab]');
  if(rt){ ui.rtab = rt.dataset.rtab; $$('[data-rtab]').forEach(b => b.setAttribute('aria-selected', String(b===rt))); const g = scene.querySelector('.rgroups'); if(g) g.innerHTML = ribbonGroupsHTML(); return; }
  const lk = t.closest('[data-lk]'); if(lk){ e.preventDefault(); openLookup(lk.dataset.lk); return; }
  const op = t.closest('[data-open]');
  if(op){ e.preventDefault(); if(op.dataset.open==='contact'){ if(isMobile()) ui.mview = 'contacts'; else ui.view = 'contacts'; render(); } else msg('“'+op.textContent+'” would open in its own form.'); return; }
  const lf = t.closest('[data-lkfocus]');
  if(lf && V.fa){ ui.fa = lf.dataset.lkfocus; ui.faOpen = true; const fa = scene.querySelector('.fa'); if(fa) fa.outerHTML = faHTML(); return; }
  const fp = t.closest('[data-fapick]'); if(fp){ setField(ui.fa, fp.dataset.fapick, true); return; }
  if(t.closest('[data-fatoggle]')){ ui.faOpen = !ui.faOpen; const fa = scene.querySelector('.fa'); if(fa) fa.outerHTML = faHTML(); return; }
  const j = t.closest('[data-jump]');
  if(j){
    if(ui.view!=='info'){ ui.view = 'info'; render(); }
    $$('[data-jump]').forEach(b => b===j || b.dataset.jump===j.dataset.jump ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
    const s = document.getElementById(j.dataset.jump); if(s){ s.classList.remove('shut'); s.scrollIntoView({block:'start'}); }
    return;
  }
  const col = t.closest('[data-collapse]'); if(col){ col.closest('.tsec').classList.toggle('shut'); return; }
  const az = t.closest('[data-az]'); if(az){ ui.az = az.dataset.az; render(); return; }
  const rec = t.closest('[data-rec]'); if(rec){ e.preventDefault(); openRecord(rec.closest('tr')); return; }
  const row = t.closest('tr[data-row]');
  if(row){
    const cb = row.querySelector('input');
    if(t!==cb) cb.checked = !cb.checked;
    row.classList.toggle('sel', cb.checked); updateCount(row.closest('table')); return;
  }
});
document.addEventListener('change', e => {
  if(e.target.matches('input[data-all]')){
    const tbl = e.target.closest('table');
    tbl.querySelectorAll('tr[data-row]').forEach(r => { r.querySelector('input').checked = e.target.checked; r.classList.toggle('sel', e.target.checked); });
    updateCount(tbl);
  }
});
function updateCount(tbl){
  const box = tbl.closest('.gview, .card, .fgv'); const el = box && box.querySelector('[data-count]'); if(!el) return;
  const total = tbl.querySelectorAll('tr[data-row]').length, sel = tbl.querySelectorAll('tr[data-row] input:checked').length;
  el.textContent = (V.fam==='uci' || V.fam==='flat') ? 'Rows: '+total+(sel?' ('+sel+' selected)':'') : (total ? '1 - '+total+' of '+total+' ('+sel+' selected)' : '0 - 0 of 0');
}
function openRecord(tr){ if(tr) msg('“'+tr.children[1].textContent+'” would open in its own form. Only the account form is part of this recreation.'); }
document.addEventListener('dblclick', e => { const r = e.target.closest('tr[data-row]'); if(r && !e.target.closest('.veil')) openRecord(r); });
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target.closest('[data-f]'); if(!el) return;
  if(el.type==='radio' && !el.checked) return;
  S[el.dataset.f] = el.value; S.dirty = true; refreshChrome();
}));
document.addEventListener('mouseover', e => {
  const mb = e.target.closest('[data-menu]'); if(!mb) return;
  const open = document.querySelector('.menu.open');
  if(open && open !== mb.parentElement && open.parentElement === mb.parentElement.parentElement) openMenu(mb.parentElement);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    closeMenus();
    if(!$('#lkVeil').hidden) $('#lkVeil').hidden = true;
    else if(!$('#msgVeil').hidden){ if($('#msgCancel').hidden) $('#msgOk').click(); else $('#msgCancel').click(); }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); if(ui.win==='open' || isMobile()) save(); }
  if(e.key==='Enter' && e.target.matches('tr[data-row]')) openRecord(e.target);
  if(e.key==='Enter' && e.target.matches('tr[data-mopen]')) e.target.click();
});

/* ---------------- clock + start ---------------- */
function tick(){ const d = new Date(); $$('.clock').forEach(c => c.textContent = d.getHours()+':'+pad(d.getMinutes())); }
setInterval(tick, 30000);

const h = location.hash.replace(/^#/,''), start = VERS.find(v => v.tok === h.replace(/-mobile$/,''));
if(start) V = start;
if(/-mobile$/.test(h)) MODE = 'mobile';
resetUi(); renderStrip(); render();
})();
</script>
</body>
</html>
